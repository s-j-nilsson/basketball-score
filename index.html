
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Basketresultat</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="./icons/180.png">
</head>
<body>

<div id="config-screen" class="screen">
  <h1>Ny match</h1>

  <section>
    <h2>Lag</h2>
    <label>Lag 1<input id="team1" /></label>
    <label>Lag 2<input id="team2" /></label>
  </section>

  <section>
    <h2>Matchformat</h2>
    <label>
      Antal perioder
      <select id="numPeriods">
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
      </select>
    </label>
  </section>

  <section>
    <h2>Poäng</h2>
    <label><input type="checkbox" id="p1"> 1 poäng</label>
    <label><input type="checkbox" id="p2"> 2 poäng</label>
    <label><input type="checkbox" id="p3"> 3 poäng</label>
  </section>

  <section>
    <h2>Delning</h2>
    <pre class="preview">
Period 1
VB     0 - 0     Motståndare
    </pre>
  </section>

  <button id="startGame">Starta match</button>
</div>

<div id="game-screen" class="screen hidden">
  <header>
    <h1 id="gameTitle"></h1>

    <div class="period-header-controls">
      <button id="prevPeriod">◀</button>
      <h2 id="periodLabel"></h2>
      <button id="nextPeriod">▶</button>
    </div>
  </header>

  <div class="teams">
    <div class="team vb">
      <div class="name" id="name1"></div>
      <div class="score" id="score1"></div>
      <div class="buttons" id="buttons1"></div>
    </div>

    <div class="team opponent">
      <div class="name" id="name2"></div>
      <div class="score" id="score2"></div>
      <div class="buttons" id="buttons2"></div>
    </div>
  </div>

  <div class="controls">
    <button id="undo">Ångra</button>
    <button id="share">Dela resultat</button>
    <button id="newGame">Ny match</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
