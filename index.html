
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Basketball Score</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="./icons/180.png">
</head>
<body>

<div id="config-screen" class="screen">
  <h1>New Game</h1>

  <section>
    <h2>Teams</h2>
    <label>Team 1<input id="team1" /></label>
    <label>Team 2<input id="team2" /></label>
  </section>

  <section>
    <h2>Game format</h2>
    <label>Number of periods<input id="numPeriods" type="number" min="1" max="10" /></label>
  </section>

  <section>
    <h2>Scoring</h2>
    <label><input type="checkbox" id="p1"> 1 point</label>
    <label><input type="checkbox" id="p2"> 2 points</label>
    <label><input type="checkbox" id="p3"> 3 points</label>
  </section>

  <section>
    <h2>Sharing</h2>
    <pre class="preview">
Period 1
VB 0 - Opponent 0
    </pre>
  </section>

  <button id="startGame">Start Game</button>
</div>

<div id="game-screen" class="screen hidden">
  <header>
    <h1 id="gameTitle"></h1>

    <div class="period-header-controls">
      <button id="prevPeriod">◀</button>
      <h2 id="periodLabel"></h2>
      <button id="nextPeriod">▶</button>
    </div>
  </header>

  <div class="teams">
    <div class="team vb">
      <div class="name" id="name1"></div>
      <div class="score" id="score1"></div>
      <div class="buttons" id="buttons1"></div>
    </div>

    <div class="team opponent">
      <div class="name" id="name2"></div>
      <div class="score" id="score2"></div>
      <div class="buttons" id="buttons2"></div>
    </div>
  </div>

  <div class="controls">
    <button id="undo">Undo</button>
    <button id="share">Share score</button>
    <button id="newGame">New Game</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
